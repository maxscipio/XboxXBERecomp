# XDK 5455 library data layouts the runtime reads or writes. Each value was read from the 5455 library code of
# Otogi: Myth of Demons (default.xbe, title 0x46530002); the address is the function in that image.
# Method: the 5659 library functions (d3d8.lib) were placed in this image by bytes and by approximate matching, then
# the displacements of the same instructions compared. 5455's CDevice is 0x414 smaller than 5659's up to +0x968 and
# 0x410 smaller after it (one extra dword at +0x55C).
[layout]
# D3D8 CDevice, the static device D3D__pDevice points at
CDevice_Push          = 0x0     # D3DDevice_SetTexture 0xF85B0 reads it, compares with +4, calls MakeSpace
CDevice_PushThreshold = 0x4     # D3DDevice_SetTexture 0xF85B0 compares the push pointer with it
CDevice_BaseVertex    = 0x1C    # D3DDevice_SetIndices 0xF8760 stores BaseVertexIndex
CDevice_IndexBuffer   = 0x388   # D3DDevice_SetIndices 0xF8760 reads the old one and stores the new one
CDevice_ZScale        = 0x530   # D3DDevice_GetViewportOffsetAndScale 0xF5380 scales the Z range by it
CDevice_SuperSampleX  = 0x544   # D3DDevice_GetViewportOffsetAndScale 0xF5380 scales viewport X by it
CDevice_SuperSampleY  = 0x548   # D3DDevice_GetViewportOffsetAndScale 0xF5380 scales viewport Y by it
CDevice_Transforms    = 0x840   # D3DDevice_SetTransform 0xF78F0 copies 16 dwords to +0x840 + type * 64
CDevice_Textures      = 0xB68   # D3DDevice_SetTexture 0xF85B0 reads and stores [stage]
CDevice_Palettes      = 0xB78   # 5659 offset minus 0x410; D3DDevice_SetPalette is not linked into this image
CDevice_RenderTarget  = 0x15E4  # D3DDevice_GetRenderTarget2 0xF8310 returns it, D3DDevice_SetViewport 0xF8350 reads it
CDevice_Depth         = 0x15E8  # D3DDevice_GetDepthStencilSurface2 0xF8330 returns it
CDevice_BackBuffer    = 0x15F4  # D3DDevice_GetBackBuffer2 0xF7F90 returns [0x15F4 + n * 4] for index 0; InitializeFrameBuffers 0xFF530 fills the table
CDevice_FrontBuffer   = 0x15F8  # D3DDevice_GetBackBuffer2 0xF7F90 returns it for index -1
CDevice_SwapCount     = 0x2058  # D3DDevice_Swap 0xF4D20 increments it and returns it
CDevice_Size          = 0x2080  # Direct3D_CreateDevice 0xF9C40 clears 0x820 dwords of the device on failure
CDevice_Flags             = 0x8    # Direct3D_CreateDevice 0xF9C40 ors BehaviorFlags & 0x10 into it, D3DDevice_SetPixelShader 0xF9600 tests that bit
CDevice_Time              = 0x2C   # D3DDevice_SetTexture 0xF85B0 stores the fence time at +0x2C
CDevice_PixelShader       = 0x36C  # D3DDevice_SetPixelShader 0xF9600 stores the handle at the top
CDevice_VertexShader      = 0x37C  # D3DDevice_SetVertexShader 0xF7550 reads and stores the current shader object here, the handle goes to 0x380
CDevice_BackBufferScale   = 0x554  # CDevice::InitializeFrameBuffers 0xFF530 stores the X scale as a float, the Y scale at +4
CDevice_Viewport          = 0xAC0  # D3DDevice_SetViewport 0xF8350 stores X, Y, Width, Height, MinZ (+0x10), MaxZ
CDevice_ScreenSpaceOffset = 0xAD8  # D3DDevice_SetScreenSpaceOffset 0xF8C70 stores x + 0.53125, y + 0.53125 at +4
CDevice_AutoDepth         = 0x1600 # CDevice::InitializeFrameBuffers 0xFF530 stores the depth buffer it makes
# the miniport is at +0x1808 (D3DDevice_SetGammaRamp 0xF7860); its own fields keep their 5659 offsets
CDevice_VBlankCallback    = 0x1998 # miniport + 0x190, called by CMiniport::VBlank
CDevice_VBlankEvent       = 0x199C # D3DDevice_BlockUntilVerticalBlank 0xF7A60 waits on it, clears its SignalState at +4
CDevice_DisplayFlags      = 0x19BC # miniport + 0x1B4, 5659 offset minus 0x410
CDevice_VBlankCount       = 0x19C8 # miniport + 0x1C0
CDevice_Field             = 0x19D8 # miniport + 0x1D0
CDevice_GammaRamps        = 0x19E4 # D3DDevice_SetGammaRamp 0xF7860 copies to miniport + 0x1DC + index * 0x300
CDevice_GammaPending      = 0x1FE4 # D3DDevice_SetGammaRamp 0xF7860 sets [miniport + 0x7DC + index * 4]
# D3D8 globals
DirtyFlags_Texture    = 0x4800  # D3DDevice_SetTexture 0xF85B0 ors it into D3D__DirtyFlags
TextureState_Stage    = 32      # [stage * 32 + type] dwords
Stream_Size           = 12      # D3DDevice_SetStreamSource 0xF7150 indexes the stream table by n * 12
Stream_Stride         = 0x0     # D3DDevice_SetStreamSource 0xF7150 stores Stride
Stream_Buffer         = 0x8     # D3DDevice_SetStreamSource 0xF7150 stores the vertex buffer
PixelShader_Definition = 0x8  # D3DDevice_SetPixelShader 0xF9600 reads the definition pointer at handle + 8
# DSOUND
CDirectSoundStream_Vtable  = 0x0  # same in every build so far
CDirectSoundStream_Vtable2 = 0x4
EffectsImage_Skip0    = 0x804
EffectsImage_Skip1    = 0x80C
EffectsImage_Desc     = 0x818
# XAPI XPP device type record
XPP_Current           = 0x0
XPP_Changed           = 0x4
XPP_Previous          = 0x8
